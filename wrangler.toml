# Cloudflare Pages — frontend static (Vite React SPA, package manager: bun)
# Deploy: bunx wrangler pages deploy dist
name = "ami-asisten"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"

# Build-time env (di-inline Vite via import.meta.env.VITE_*)
# Set di dashboard CF Pages > Settings > Environment variables (Production):
#   VITE_APIAMIS_BASE_URL = https://apiamis.cianjur.space/api
#   VITE_BUN_URL         = https://arumanis.cianjur.space
#
# Build command CF Pages (package manager bun):
#   bun install && bun run build
#
# Custom domain: ami.cianjur.space -> CNAME ke <proyek>.pages.dev
